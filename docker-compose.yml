services:
  postgres:
    image: postgres:16-alpine
    container_name: lms_postgres
    restart: always
    environment:
      POSTGRES_USER: lms_user
      POSTGRES_PASSWORD: lms_password
      POSTGRES_DB: lms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_lms_data:/var/lib/postgresql/data
    networks:
      - lms_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms_user -d lms_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: 
      context: ./server
      dockerfile: Dockerfile
      target: development
    container_name: lms_server
    restart: always
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["npm", "run", "dev"]
    ports:
      - "5001:5001"
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lms_network
  
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: base
    container_name: lms_client
    restart: always
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["npm", "run", "dev"]
    ports:
      - "3001:3001"
    environment:
      - VITE_API_BASE_URL=http://localhost:5001/api/v1
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    depends_on:
      - server
    networks:
      - lms_network

volumes:
  postgres_lms_data:
  server_node_modules:
  client_node_modules:

networks:
  lms_network:
    driver: bridge
    