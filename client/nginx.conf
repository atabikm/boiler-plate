server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: semua route yang tidak cocok file statis
    # dialihkan ke index.html agar React Router yang menanganinya
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache file aset bervite (hash di nama file -> aman di-cache lama)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
